name: Deploy to Kubernetes

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      MERCADO_PAGO_TOKEN:
        required: true
      MERCADO_PAGO_WEBHOOK_URL:
        required: true

jobs:
  k8s-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Terraform Outputs
        id: tf_outputs
        run: |
          aws s3 cp s3://soatfiap-fase4/state/oficina-infra/terraform.tfstate infra.tfstate

          CLUSTER_NAME=$(jq -r '.outputs.cluster_name.value' infra.tfstate)
          SQS_BASE_URL=$(jq -r '.outputs.sqs_base_url.value' infra.tfstate)
          SNS_BASE_ARN=$(jq -r '.outputs.sns_base_arn.value' infra.tfstate)

          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "sqs_base_url=${SQS_BASE_URL}" >> $GITHUB_OUTPUT
          echo "sns_base_arn=${SNS_BASE_ARN}" >> $GITHUB_OUTPUT

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf_outputs.outputs.cluster_name }}" \
            --region ${{ env.AWS_REGION }}

      - name: Apply Namespace and Base Resources
        env:
          SQS_BASE_URL: ${{ steps.tf_outputs.outputs.sqs_base_url }}
          SNS_BASE_ARN: ${{ steps.tf_outputs.outputs.sns_base_arn }}
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/payment-sa.yaml
          envsubst < deploy/k8s/configmap.yaml | kubectl apply -f -

      - name: Apply Kubernetes Secret
        env:
          MERCADO_PAGO_TOKEN: ${{ secrets.MERCADO_PAGO_TOKEN }}
          MERCADO_PAGO_WEBHOOK_URL: ${{ secrets.MERCADO_PAGO_WEBHOOK_URL }}
        run: |
          envsubst < deploy/k8s/secrets.yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          kubectl apply -f deploy/k8s/metric-server.yaml
          kubectl apply -f deploy/k8s/app.yaml
          kubectl apply -f deploy/k8s/hpa.yaml
          kubectl apply -f deploy/k8s/services.yaml

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout restart deployment/payment -n fiap
